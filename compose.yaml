name: viewer

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-viewer}
  POSTGRES_USER: ${POSTGRES_USER:-viewer}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewer-local-password}

x-backend-dsn: &backend-dsn
  DB_DSN: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD:-viewer-local-password}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - application

  migrations:
    image: ${BACKEND_MIGRATIONS_IMAGE:-idrisovmarat/viewer_backend-migrations:0.2.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD:-viewer-local-password}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable
    command:
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  reports-init:
    image: alpine:3.22
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - chown 10001:10001 /app/reports && chmod 750 /app/reports
    volumes:
      - reports-data:/app/reports
    restart: "no"

  xa-cache-init:
    image: alpine:3.22
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - chown 10001:10001 /app/xa-cache && chmod 750 /app/xa-cache
    volumes:
      - xa-cache-data:/app/xa-cache
    restart: "no"

  plans-init:
    image: alpine:3.22
    user: "0:0"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - chown 10001:10001 /app/plans && chmod 750 /app/plans
    volumes:
      - plans-data:/app/plans
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:-idrisovmarat/viewer_backend:0.2.0}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${IMAGE_VERSION:-local}
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      <<: *backend-dsn
      HTTP_ADDR: :8080
      TZ: ${TZ:-Asia/Tomsk}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      REPORT_AGENT_ID: ${REPORT_AGENT_ID:-2}
      PLANS_DIR: ${PLANS_DIR:-/app/plans}
      XA_CACHE_DIR: ${XA_CACHE_DIR:-/app/xa-cache}
      XA_CACHE_TIMEOUT_SECONDS: ${XA_CACHE_TIMEOUT_SECONDS:-120}
      XA_CACHE_FFMPEG_PATH: ${XA_CACHE_FFMPEG_PATH:-/usr/bin/ffmpeg}
      XA_CACHE_STUDY_WORKERS: ${XA_CACHE_STUDY_WORKERS:-2}
      XA_CACHE_FRAME_WORKERS: ${XA_CACHE_FRAME_WORKERS:-3}
      XA_CACHE_CINE_WORKERS: ${XA_CACHE_CINE_WORKERS:-1}
      XA_CACHE_CINE_CRF: ${XA_CACHE_CINE_CRF:-23}
      XA_CACHE_BUILD_ARCHIVE: ${XA_CACHE_BUILD_ARCHIVE:-false}
      XA_CACHE_WARM_EXISTING: ${XA_CACHE_WARM_EXISTING:-false}
      REMOTE_PACS_URL: ${REMOTE_PACS_URL:-http://pacs:8042/instances}
      REMOTE_PACS_USERNAME: ${REMOTE_PACS_USERNAME:-mapdr}
      REMOTE_PACS_PASSWORD: ${REMOTE_PACS_PASSWORD:-changestrongpassword}
      REMOTE_PACS_TIMEOUT_SECONDS: ${REMOTE_PACS_TIMEOUT_SECONDS:-300}
      REMOTE_PACS_IMPORT_WORKERS: ${REMOTE_PACS_IMPORT_WORKERS:-4}
    volumes:
      - reports-data:/app/reports
      - plans-data:/app/plans
      - xa-cache-data:/app/xa-cache
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      reports-init:
        condition: service_completed_successfully
      xa-cache-init:
        condition: service_completed_successfully
      plans-init:
        condition: service_completed_successfully
      pacs:
        condition: service_healthy
    restart: unless-stopped
    networks:
      application:
        aliases:
          - viewer-backend
      pacs:

  pacs:
    image: jodogne/orthanc-plugins:1.12.11
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_HTTP_PORT:-8042}:8042"
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_DICOM_PORT:-4242}:4242"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --user=mapdr --password=changestrongpassword -O /dev/null http://127.0.0.1:8042/system
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - pacs

  frontend:
    image: ${FRONTEND_IMAGE:-idrisovmarat/viewer_frontend:0.2.0}
    environment:
      BACKEND_URL: http://backend:8080
      PACS_URL: http://pacs:8042
      PACS_AUTHORIZATION: ${PACS_AUTHORIZATION:-Basic bWFwZHI6Y2hhbmdlc3Ryb25ncGFzc3dvcmQ=}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTP_PORT:-80}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_HTTPS_PORT:-443}:8443"
    volumes:
      - "${VIEWER_TLS_DIR:-/opt/viewer/tls}:/etc/viewer-tls:ro"
      - "${CERTBOT_WEBROOT:-/opt/viewer/certbot/www}:/var/www/certbot:ro"
    depends_on:
      backend:
        condition: service_started
      pacs:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - application
      - pacs

networks:
  application:
    driver: bridge
  pacs:
    driver: bridge

volumes:
  postgres-data:
  orthanc-data:
  reports-data:
  plans-data:
  xa-cache-data:
