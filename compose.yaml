name: viewer

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-viewer}
  POSTGRES_USER: ${POSTGRES_USER:-viewer}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viewer-local-password}

x-backend-dsn: &backend-dsn
  DB_DSN: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD:-viewer-local-password}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable

services:
  postgres:
    image: postgres:17-alpine
    environment:
      <<: *postgres-environment
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - application

  migrations:
    image: ${BACKEND_MIGRATIONS_IMAGE:-viewer-backend-migrations:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: migrations
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://${POSTGRES_USER:-viewer}:${POSTGRES_PASSWORD:-viewer-local-password}@postgres:5432/${POSTGRES_DB:-viewer}?sslmode=disable
    command:
      - up
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - application

  backend:
    image: ${BACKEND_IMAGE:-viewer-backend:local}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        VERSION: ${IMAGE_VERSION:-local}
        VCS_REF: ${VCS_REF:-unknown}
    environment:
      <<: *backend-dsn
      HTTP_ADDR: :8080
      TZ: ${TZ:-Asia/Tomsk}
      REPORTS_DIR: ${REPORTS_DIR:-/app/reports}
      REMOTE_PACS_URL: ${REMOTE_PACS_URL:-http://pacs:8042/instances}
      REMOTE_PACS_USERNAME: ${REMOTE_PACS_USERNAME:-mapdr}
      REMOTE_PACS_PASSWORD: ${REMOTE_PACS_PASSWORD:-changestrongpassword}
      REMOTE_PACS_TIMEOUT_SECONDS: ${REMOTE_PACS_TIMEOUT_SECONDS:-300}
    volumes:
      - reports-data:/app/reports
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      application:
        aliases:
          - viewer-backend
      pacs:

  pacs:
    image: jodogne/orthanc-plugins:1.12.11
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_HTTP_PORT:-8042}:8042"
      - "${BIND_ADDRESS:-0.0.0.0}:${ORTHANC_DICOM_PORT:-4242}:4242"
    volumes:
      - ./ohif-orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc-data:/var/lib/orthanc/db
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --user=mapdr --password=changestrongpassword -O /dev/null http://127.0.0.1:8042/system
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - pacs

  ohif:
    image: ohif/viewer:v4.12.51.21579
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${OHIF_PORT:-3000}:80"
    volumes:
      - ./ohif-orthanc/nginx_ohif.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ohif-orthanc/ohif.js:/usr/share/nginx/html/app-config.js:ro
    depends_on:
      pacs:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pacs

networks:
  application:
    driver: bridge
  pacs:
    driver: bridge

volumes:
  postgres-data:
  orthanc-data:
  reports-data:
