name: viewer

services:
  frontend:
    image: ${FRONTEND_IMAGE:-idrisovmarat/viewer_frontend:0.1.0}
    environment:
      BACKEND_URL: http://backend:8080
      PACS_URL: http://pacs:8042
      PACS_AUTHORIZATION: ${PACS_AUTHORIZATION:-Basic bWFwZHI6Y2hhbmdlc3Ryb25ncGFzc3dvcmQ=}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${FRONTEND_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_started
      pacs:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - application
      - pacs
